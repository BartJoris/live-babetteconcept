name: Supplier Onboarding Agent

# Triggered automatically when pages/api/suppliers/onboard.ts opens a PR from a
# "supplier/<id>-<timestamp>" branch. Uses Claude Code (via a personal Claude
# Pro/Max subscription OAuth token, not a paid API key — see CLAUDE_CODE_OAUTH_TOKEN
# secret) to refine the auto-generated concept parser, add tests, and refine the
# stub detection rule, entirely on this repo's own infrastructure (no third-party
# code-storage service involved — unlike Cursor Cloud Agents, which our Cursor
# Enterprise team's privacy settings currently block).
on:
  pull_request:
    # No "synchronize": the agent's own commits/pushes would otherwise
    # re-trigger this workflow on itself (infinite loop / runaway cost).
    # Use "reopened" (close + reopen the PR) to manually retry a failed run.
    types: [opened, reopened]

jobs:
  refine-supplier-plugin:
    if: startsWith(github.head_ref, 'supplier/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required by claude-code-action to mint its OIDC-based GitHub token
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Determine supplier id
        id: supplier
        run: |
          BRANCH="${{ github.head_ref }}"
          ID="${BRANCH#supplier/}"
          ID="${ID%-*}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Er staat een automatisch gegenereerd concept van een nieuwe leveranciers-parser
            klaar in deze PR voor leverancier-ID "${{ steps.supplier.outputs.id }}".

            Sample-bestanden staan in `lib/suppliers/${{ steps.supplier.outputs.id }}/samples/`.
            Het concept staat in `lib/suppliers/${{ steps.supplier.outputs.id }}/index.ts`,
            gegenereerd naar het patroon van `lib/suppliers/create-csv-supplier.ts` /
            bestaande plugins in `lib/suppliers/*/index.ts`.

            Taken (commit en push na ELKE afgeronde taak hieronder — niet pas op het
            einde. Zo blijft er bruikbare voortgang staan, zelfs als je een turn-limiet
            raakt voor je klaar bent):
            1. Verfijn `lib/suppliers/${{ steps.supplier.outputs.id }}/index.ts` zodat het
               correct parsed op basis van de échte sample-data (open en lees de
               sample-bestanden zelf, ga niet af op aannames). Commit + push.
            2. Voeg een Vitest-test toe die deze sample-bestanden als fixtures gebruikt
               (zie `lib/**/__tests__/*.test.ts` voor stijl). Commit + push.
            3. Verbeter de stub-detectieregel voor "${{ steps.supplier.outputs.id }}" in
               `pages/api/detect-supplier.ts` (gemarkeerd met `TODO(agent)`) op basis van
               de echte CSV-headers/inhoud. Commit + push.
            4. Als `lib/suppliers/${{ steps.supplier.outputs.id }}/samples/image-filenames.txt`
               bestaat: analyseer die bestandsnamen samen met de sample-productreferenties en
               implementeer een werkende `imageUpload.extractReference`-functie (zie
               `lib/suppliers/tangerine/index.ts` en `lib/suppliers/jellymallow/index.ts`
               voor patronen). Geef `null` terug als er geen duidelijk patroon te herkennen is.
               Commit + push.
            5. Draai eerst `npm run typecheck` en `npm run test:run` (snel, gebruik dit als
               iteratieve feedback-loop) en los fouten op. Draai `npm run build` pas als
               laatste, uitsluitend ter finale controle — herhaal die niet onnodig, hij is traag.
               Commit + push het eindresultaat.

            Belangrijke restricties: raak geen andere leveranciers-bestanden aan, open geen
            nieuwe PR, merge niet, en plaats geen PR-comments. Werk gericht en efficiënt met
            je beperkte aantal turns — commit tussentijdse voortgang liever te vaak dan te
            weinig.
          claude_args: |
            --max-turns 70
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
